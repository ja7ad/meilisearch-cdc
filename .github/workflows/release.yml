# Release on a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release):
# tests, binaries for Linux, macOS and Windows on amd64 and arm64, a GitHub
# release with checksums, and a multi-arch image on ghcr.io.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}"}
      - run: make lint
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}"}
      # Pure Go (no cgo), so every target cross-compiles on one runner.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="meilisearch-cdc_${GITHUB_REF_NAME#v}_${GOOS}_${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X github.com/ja7ad/meilisearch-cdc/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "dist/$name/meilisearch-cdc$ext" ./cmd/meilisearch-cdc
          cp README.md "dist/$name/"
          mkdir -p "dist/$name/docs" && cp docs/api.md docs/cli.md "dist/$name/docs/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      # The linux/amd64 binary runs on the runner: make sure it starts.
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          name="meilisearch-cdc_${GITHUB_REF_NAME#v}_linux_amd64"
          tar -xzf "dist/$name.tar.gz" -C dist
          test "$("dist/$name/meilisearch-cdc" version)" = "${GITHUB_REF_NAME}"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > checksums.txt && cat checksums.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only for final releases, not for pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # The Dockerfile cross-compiles in the build stage, so no emulation is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
