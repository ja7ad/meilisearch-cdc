# Every supported source, two Meilisearch instances and a mail catcher, for
# the full GUI end-to-end tests (test/ui/full) and manual testing.
#
#   docker compose -f deploy/e2e/docker-compose.yml up -d --wait
#   docker compose -f deploy/e2e/docker-compose.yml down -v
#
# Host ports are fixed (see test/ui/lab for the connection strings).
name: cdc-e2e

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=20", "-c", "max_wal_senders=20"]
    environment: { POSTGRES_USER: cdc, POSTGRES_PASSWORD: cdc, POSTGRES_DB: shop }
    ports: ["15432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cdc -d shop"], interval: 2s, retries: 60 }

  mysql:
    image: mysql:8.4
    command: ["--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--server-id=1"]
    environment: { MYSQL_ROOT_PASSWORD: cdc, MYSQL_DATABASE: shop }
    ports: ["13306:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcdc"], interval: 2s, retries: 90 }

  mariadb:
    image: mariadb:11
    command: ["--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--server-id=2"]
    environment: { MARIADB_ROOT_PASSWORD: cdc, MARIADB_DATABASE: shop }
    ports: ["13307:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 90 }

  mongodb:
    image: mongo:7
    # The replica set member is advertised as localhost:27018 so the service
    # on the host can follow it.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports: ["27018:27018"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27018 --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27018'}]}).ok }\" | grep -q 1"]
      interval: 2s
      retries: 60

  dynamodb:
    image: amazon/dynamodb-local:2.2.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb", "-disableTelemetry"]
    ports: ["18000:8000"]
    healthcheck: { test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"], interval: 2s, retries: 30 }

  couchdb:
    image: couchdb:3
    environment: { COUCHDB_USER: admin, COUCHDB_PASSWORD: secret }
    ports: ["15984:5984"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:5984/_up"], interval: 2s, retries: 60 }

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Strong@Passw0rd", MSSQL_AGENT_ENABLED: "true", MSSQL_PID: Developer }
    ports: ["11433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Strong@Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 3s
      retries: 100

  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.3
    command: ["start-single-node", "--insecure"]
    ports: ["26258:26257"]
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:8080/health?ready=1"], interval: 2s, retries: 60 }

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --mode=dev-container
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://localhost:19092
    ports: ["19092:19092"]
    healthcheck: { test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 2s, retries: 60 }

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }

  meili-primary:
    image: getmeili/meilisearch:latest
    environment: { MEILI_MASTER_KEY: e2e-master-key, MEILI_NO_ANALYTICS: "true" }
    ports: ["17700:7700"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:7700/health"], interval: 2s, retries: 30 }

  meili-replica:
    image: getmeili/meilisearch:latest
    environment: { MEILI_MASTER_KEY: e2e-master-key, MEILI_NO_ANALYTICS: "true" }
    ports: ["17701:7700"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:7700/health"], interval: 2s, retries: 30 }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["11025:1025", "18025:8025"]
